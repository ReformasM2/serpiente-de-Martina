<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6a5bd">
  <title>Rosa Snake</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #442a36;
      --cream: #fff7ed;
      --screen: #f5f8df;
      --green: #526c48;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      color: var(--ink);
      background-color: #fff4f1;
      background-image: radial-gradient(#efb5c5 0.8px, transparent 0.8px);
      background-size: 18px 18px;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    button { font: inherit; }
    .cabinet {
      width: min(100%, 486px);
      padding: 25px 25px 22px;
      border: 2px solid #d84d79;
      border-radius: 26px 26px 34px 34px;
      background: linear-gradient(145deg, #ffb6ca, #f489a8 64%, #e96c91);
      box-shadow: 0 8px 0 #d34c76, 0 20px 42px #8e455424, inset 0 2px 0 #ffd9e3;
    }
    .brand-row { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 18px; }
    .brand { margin: 0; font-size: 13px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
    .brand span { color: #fff6f3; }
    .power { width: 9px; height: 9px; border-radius: 50%; background: #7faf63; box-shadow: 0 0 0 3px #ad5b78, 0 0 10px #efffb0; }
    .screen-frame { padding: 13px; border: 2px solid #bd4d70; border-radius: 16px; background: #693f50; box-shadow: inset 0 3px 7px #39232c; }
    .screen-top { display: flex; justify-content: space-between; align-items: center; margin: 0 1px 9px; color: #f6d5df; font: 700 11px "Courier New", monospace; letter-spacing: 1px; }
    .screen-top .signal { color: #c9ec96; }
    .board-wrap { position: relative; overflow: hidden; border: 3px solid #bfbd91; border-radius: 3px; background: var(--screen); box-shadow: 0 0 0 1px #3b3d30; }
    canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; touch-action: none; }
    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 8px;
      padding: 16px;
      text-align: center;
      color: var(--green);
      background: #f5f8dfe8;
    }
    .overlay[hidden] { display: none; }
    .overlay strong { font: 900 clamp(20px, 6vw, 27px) "Courier New", monospace; letter-spacing: 1px; }
    .overlay span { font: 12px "Courier New", monospace; }
    .stats { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 16px 3px 15px; font-family: "Courier New", monospace; text-transform: uppercase; }
    .stat { display: grid; gap: 3px; }
    .stat:last-child { text-align: right; }
    .stat-label { color: #713e52; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
    .stat-value { color: #fffaf4; font-size: 22px; font-weight: 900; text-shadow: 0 2px #c85076; }
    .divider { width: 1px; height: 30px; background: #b3486d80; }
    .actions { display: flex; justify-content: center; gap: 10px; }
    .action {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 15px;
      border: 1px solid #b8446a;
      border-radius: 9px;
      color: #fffaf4;
      background: #c84c73;
      box-shadow: 0 3px 0 #a73860, inset 0 1px #f89ab2;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 100ms ease, background 100ms ease;
    }
    .action:hover { background: #b83c66; }
    .action:active { transform: translateY(2px); box-shadow: 0 1px 0 #a73860; }
    .action:focus-visible, .pad button:focus-visible { outline: 3px solid #fff3b0; outline-offset: 3px; }
    .below-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; }
    .hint { max-width: 190px; color: #633d4c; font-size: 11px; line-height: 1.5; }
    .pad { display: grid; grid-template: repeat(2, 37px) / repeat(3, 39px); gap: 3px; touch-action: manipulation; }
    .pad button {
      display: grid;
      place-items: center;
      border: 1px solid #b9446a;
      border-radius: 9px;
      color: #fff9f3;
      background: #cf5278;
      box-shadow: 0 2px 0 #a83d62, inset 0 1px #f8a7ba;
      font-size: 17px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pad button:active { transform: translateY(1px); box-shadow: 0 1px 0 #a83d62; }
    .pad [data-dir="up"] { grid-area: 1 / 2; }
    .pad [data-dir="left"] { grid-area: 2 / 1; }
    .pad [data-dir="down"] { grid-area: 2 / 2; }
    .pad [data-dir="right"] { grid-area: 2 / 3; }
    .speaker { display: flex; justify-content: center; gap: 5px; margin-top: 20px; }
    .speaker i { width: 5px; height: 21px; border-radius: 4px; background: #b94c70a8; box-shadow: inset 0 1px 2px #7e3450; transform: rotate(24deg); }
    @media (max-width: 390px) {
      .cabinet { padding: 19px 17px 17px; }
      .screen-frame { padding: 9px; }
      .below-controls { align-items: end; }
      .hint { max-width: 140px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; } }
  </style>
</head>
<body>
  <main class="cabinet" aria-label="Videojuego Rosa Snake">
    <header class="brand-row">
      <h1 class="brand">Videojuego de Martina</h1>
      <span class="power" aria-label="Encendido"></span>
    </header>
    <section class="screen-frame" aria-label="Pantalla del juego">
      <div class="screen-top"><span>SNAKE II</span><span class="signal">● ● ●</span></div>
      <div class="board-wrap">
        <canvas id="game" width="400" height="400" aria-label="Tablero de Snake"></canvas>
        <div class="overlay" id="overlay" aria-live="polite">
          <strong id="overlay-title">¿LISTA?</strong>
          <span id="overlay-copy">Pulsa JUGAR para empezar</span>
        </div>
      </div>
    </section>
    <section class="stats" aria-label="Puntuación">
      <div class="stat"><span class="stat-label">Puntos</span><span class="stat-value" id="score">00</span></div>
      <span class="divider" aria-hidden="true"></span>
      <div class="stat"><span class="stat-label">Récord</span><span class="stat-value" id="best">00</span></div>
    </section>
    <div class="actions">
      <button class="action" id="start" type="button">▶ <span>Jugar</span></button>
      <button class="action" id="pause" type="button" aria-label="Pausar">Ⅱ <span>Pausa</span></button>
    </div>
    <div class="below-controls">
      <div class="hint">Flechas o WASD para moverte.<br>Espacio para pausar.</div>
      <div class="pad" aria-label="Controles táctiles">
        <button type="button" data-dir="up" aria-label="Arriba">▲</button>
        <button type="button" data-dir="left" aria-label="Izquierda">◀</button>
        <button type="button" data-dir="down" aria-label="Abajo">▼</button>
        <button type="button" data-dir="right" aria-label="Derecha">▶</button>
      </div>
    </div>
    <div class="speaker" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const scoreLabel = document.querySelector("#score");
      const bestLabel = document.querySelector("#best");
      const overlay = document.querySelector("#overlay");
      const overlayTitle = document.querySelector("#overlay-title");
      const overlayCopy = document.querySelector("#overlay-copy");
      const cell = 20;
      const cells = canvas.width / cell;
      const directions = {
        up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
        left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
      };
      let snake;
      let direction;
      let nextDirection;
      let food;
      let score = 0;
      let best = Number(localStorage.getItem("rosa-snake-best") || 0);
      let timer = null;
      let state = "ready";

      bestLabel.textContent = String(best).padStart(2, "0");

      function placeFood() {
        let candidate;
        do {
          candidate = { x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells) };
        } while (snake.some((part) => part.x === candidate.x && part.y === candidate.y));
        return candidate;
      }

      function draw() {
        ctx.fillStyle = "#f5f8df";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#e6ebce";
        for (let y = 0; y < cells; y += 1) {
          for (let x = 0; x < cells; x += 1) {
            if ((x + y) % 2 === 0) ctx.fillRect(x * cell, y * cell, cell, cell);
          }
        }
        ctx.fillStyle = "#d94f79";
        ctx.fillRect(food.x * cell + 5, food.y * cell + 5, 10, 10);
        snake.forEach((part, index) => {
          ctx.fillStyle = "#526c48";
          ctx.fillRect(part.x * cell + 2, part.y * cell + 2, cell - 4, cell - 4);
          if (index === 0) {
            ctx.fillStyle = "#f5f8df";
            if (direction.x === 0) {
              ctx.fillRect(part.x * cell + 5, part.y * cell + (direction.y < 0 ? 4 : 12), 3, 3);
              ctx.fillRect(part.x * cell + 12, part.y * cell + (direction.y < 0 ? 4 : 12), 3, 3);
            } else {
              ctx.fillRect(part.x * cell + (direction.x < 0 ? 4 : 12), part.y * cell + 5, 3, 3);
              ctx.fillRect(part.x * cell + (direction.x < 0 ? 4 : 12), part.y * cell + 12, 3, 3);
            }
          }
        });
      }

      function reset() {
        snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        direction = directions.right;
        nextDirection = direction;
        score = 0;
        scoreLabel.textContent = "00";
        food = placeFood();
        draw();
      }

      function showOverlay(title, copy) {
        overlayTitle.textContent = title;
        overlayCopy.textContent = copy;
        overlay.hidden = false;
      }

      function startGame() {
        clearInterval(timer);
        reset();
        state = "playing";
        overlay.hidden = true;
        timer = setInterval(tick, Math.max(70, 145 - score * 2));
      }

      function endGame() {
        clearInterval(timer);
        timer = null;
        state = "over";
        showOverlay("FIN DEL JUEGO", `Puntuación: ${score} · Pulsa JUGAR`);
      }

      function togglePause() {
        if (state === "playing") {
          clearInterval(timer);
          timer = null;
          state = "paused";
          showOverlay("PAUSA", "Pulsa PAUSA para continuar");
        } else if (state === "paused") {
          state = "playing";
          overlay.hidden = true;
          timer = setInterval(tick, Math.max(70, 145 - score * 2));
        }
      }

      function setDirection(name) {
        if (state === "ready" || state === "over") {
          startGame();
          if (name === "up" || name === "left") direction = directions[name];
          nextDirection = direction;
          return;
        }
        if (state !== "playing") return;
        const requested = directions[name];
        if (requested.x + direction.x === 0 && requested.y + direction.y === 0) return;
        nextDirection = requested;
      }

      function tick() {
        direction = nextDirection;
        const head = {
          x: (snake[0].x + direction.x + cells) % cells,
          y: (snake[0].y + direction.y + cells) % cells
        };
        const ateFood = head.x === food.x && head.y === food.y;
        const body = ateFood ? snake : snake.slice(0, -1);
        if (body.some((part) => part.x === head.x && part.y === head.y)) {
          endGame();
          return;
        }
        snake.unshift(head);
        if (ateFood) {
          score += 1;
          scoreLabel.textContent = String(score).padStart(2, "0");
          if (score > best) {
            best = score;
            bestLabel.textContent = String(best).padStart(2, "0");
            localStorage.setItem("rosa-snake-best", String(best));
          }
          food = placeFood();
          clearInterval(timer);
          timer = setInterval(tick, Math.max(70, 145 - score * 2));
        } else {
          snake.pop();
        }
        draw();
      }

      const keyDirections = {
        ArrowUp: "up", w: "up", W: "up", ArrowDown: "down", s: "down", S: "down",
        ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right"
      };
      document.addEventListener("keydown", (event) => {
        if (keyDirections[event.key]) {
          event.preventDefault();
          setDirection(keyDirections[event.key]);
        } else if (event.code === "Space") {
          event.preventDefault();
          if (state === "ready" || state === "over") startGame();
          else togglePause();
        }
      });
      document.querySelector("#start").addEventListener("click", startGame);
      document.querySelector("#pause").addEventListener("click", togglePause);
      document.querySelectorAll(".pad button").forEach((button) => {
        button.addEventListener("click", () => setDirection(button.dataset.dir));
      });

      let touchStart = null;
      canvas.addEventListener("touchstart", (event) => {
        const touch = event.changedTouches[0];
        touchStart = { x: touch.clientX, y: touch.clientY };
      }, { passive: true });
      canvas.addEventListener("touchend", (event) => {
        if (!touchStart) return;
        const touch = event.changedTouches[0];
        const dx = touch.clientX - touchStart.x;
        const dy = touch.clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 15) return;
        setDirection(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
      }, { passive: true });
      reset();
    })();
  </script>
</body>
</html>
